# --- Bluetooth & RF Stability ---
# Boost BLE transmit power to maximum (+8 dBm) for solid split-half & host link
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Improved BLE connection stability and faster reconnection after wake
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Keyboard identifier
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# Keep Windows battery reporting reliable
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Report battery level every 5 minutes (300 seconds)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300


# --- Power Management & Deep Sleep ---
CONFIG_ZMK_SLEEP=y

# Idle state: Turn off display after 30 seconds of inactivity (30,000 ms)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep: Enter ultra-low-power mode after 15 minutes of inactivity (900,000 ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


# --- Key Scanning & Debounce ---
# 1ms press latency; 5ms release prevents key chatter
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5


# --- Display & OLED Configuration ---
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Uncomment the line below if you want the cat animation:
# CONFIG_ZMK_WIDGET_BONGO_CAT=y


# --- Hardware Subsystem Exclusions ---
# Explicitly disable RGB underglow and external power switching
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_EXT_POWER=n


# --- Pointing & ZMK Studio ---
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
